<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets iOS expose env(safe-area-inset-*) to CSS.
         Without it the page sits below the notch but env() values stay 0,
         so top bars can't reserve space when the user adds SailLine to
         their home screen (PWA mode reaches under the status bar). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e14" />
    <!-- PWA-mode status bar styling. "default" is dark text on light bg —
         matches the SailLine light theme. "black-translucent" would let
         the page draw under the status bar with light text; we already
         use viewport-fit=cover for that, so this just controls colour. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SailLine — Race intelligence for sailors</title>

    <!-- Fonts: Inter for display, JetBrains Mono for data/labels.
         Matches the design reference's typography stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
