# infra/cloudbuild.yaml
steps:
  # 1. Run backend tests (pytest). Gates deploy — a failing test fails the build.
  #    Skips the `slow` marker (live NOAA hits) for CI speed.
  #    Uses python:3.12-slim to match the Dockerfile base image.
  - name: 'python:3.12-slim'
    id: 'test'
    dir: 'backend'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest -m "not slow"

  # 2. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:latest'
      - './backend'

  # 3. Push both tags to Artifact Registry (parallel — both depend on
  #    build, not on each other)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    waitFor: ['build']
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    waitFor: ['build']
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:latest'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sailline-api'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--service-account=sailline-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector=sailline-connector'
      - '--vpc-egress=private-ranges-only'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,DB_NAME=sailline_app,DB_USER=sailline,DB_HOST=10.69.0.3,CLOUD_SQL_INSTANCE=$PROJECT_ID:us-central1:sailline-db,REDIS_HOST=10.69.1.3,REDIS_PORT=6379,GCS_WEATHER_BUCKET=sailline-weather,GCS_CERTS_BUCKET=sailline-certs,GCS_AVATARS_BUCKET=sailline-avatars,RACE_POSTPROCESS_JOB=projects/$PROJECT_ID/locations/us-central1/jobs/race-postprocess,EMAIL_FROM_ADDRESS=gray.vanderlinde@gmail.com'
      - '--set-secrets=DB_PASSWORD=sailline-db-app-password:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,SENDGRID_API_KEY=sendgrid-api-key:latest'

  # 5. Point the race-postprocess Cloud Run Job at the freshly-built image.
  #    A service deploy does NOT update Cloud Run Jobs, so without this they
  #    drift onto whatever image they were last hand-tagged with. On
  #    2026-06-08 race-postprocess was stuck on a May-15 build, so backend
  #    fixes (and the exit-2 arg fix) never reached the worker. This keeps
  #    the job's image in lockstep with the service on every push.
  #    `jobs update --image` changes ONLY the image — the container
  #    command (`python`) and baseline args (`-m workers.race_postprocess
  #    --race-id PLACEHOLDER`) are preserved.
  #    NOTE: the 18 HRRR/GFS ingest jobs still drift on hand-tagged images;
  #    bringing them under this same pattern is tracked separately (each
  #    needs a smoke-check first since they're on unknown pinned builds).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-postprocess-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'race-postprocess'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:$SHORT_SHA'
      - '--region=us-central1'

  # 6. Same lockstep treatment for the race-sweep job (added 2026-07-02).
  #    Hourly Cloud Scheduler execution ends orphaned races (started but
  #    never ended) and runs their postprocess — the server-side backstop
  #    for a dropped POST /end from the phone. One-time creation:
  #      gcloud run jobs create race-sweep `
  #        --image=us-central1-docker.pkg.dev/sailline/sailline/api:latest `
  #        --region=us-central1 --command=python `
  #        --args="-m,workers.race_sweep" `
  #        --service-account=sailline-api@sailline.iam.gserviceaccount.com `
  #        --vpc-connector=sailline-connector --vpc-egress=private-ranges-only `
  #        --set-env-vars=<same as race-postprocess> --set-secrets=<same>
  #      gcloud scheduler jobs create http race-sweep-hourly `
  #        --location=us-central1 --schedule="17 * * * *" `
  #        --uri="https://us-central1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/sailline/jobs/race-sweep:run" `
  #        --oauth-service-account-email=sailline-api@sailline.iam.gserviceaccount.com
  #    Tolerant until the job exists: `jobs update` on a missing job fails
  #    the whole build, and the one-time create is manual. Once created,
  #    this keeps it in lockstep exactly like race-postprocess.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-sweep-job'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run jobs update race-sweep \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:$SHORT_SHA \
          --region=us-central1 \
        || echo "WARNING: race-sweep job not found — create it once (see comment above), then this step keeps it updated."


# Run as the dedicated build service account
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/sailline-cloudbuild@$PROJECT_ID.iam.gserviceaccount.com'

# Logs to Cloud Logging only (avoids Cloud Storage requirement)
options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sailline/api:latest'

timeout: 1200s
